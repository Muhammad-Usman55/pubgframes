<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Tactical Dark Carbon Background with subtle border -->
  <rect width="64" height="64" rx="14" fill="#070A0E" />
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="#FFD400" stroke-width="1.5" stroke-opacity="0.35" />
  
  <!-- Subtle Internal Grid Pattern -->
  <path d="M16 8v48M32 8v48M48 8v48M8 16h48M8 32h48M8 48h48" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />

  <!-- Outer Crosshair Bracket Corners -->
  <!-- Top Left -->
  <path d="M14 22v-8h8" stroke="#FFD400" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Top Right -->
  <path d="M42 14h8v8" stroke="#FFD400" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Bottom Left -->
  <path d="M14 42v8h8" stroke="#FFD400" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Bottom Right -->
  <path d="M42 50h8v-8" stroke="#FFD400" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Precision Center Target Reticle & FPS Frame -->
  <circle cx="32" cy="32" r="10" stroke="#39F56A" stroke-width="2.5" stroke-opacity="0.9" />
  <circle cx="32" cy="32" r="3.5" fill="#FFD400" />
  
  <!-- Axis Aim Lines -->
  <line x1="32" y1="17" x2="32" y2="20" stroke="#39F56A" stroke-width="2" stroke-linecap="round" />
  <line x1="32" y1="44" x2="32" y2="47" stroke="#39F56A" stroke-width="2" stroke-linecap="round" />
  <line x1="17" y1="32" x2="20" y2="32" stroke="#39F56A" stroke-width="2" stroke-linecap="round" />
  <line x1="44" y1="32" x2="47" y2="32" stroke="#39F56A" stroke-width="2" stroke-linecap="round" />
  
  <!-- Stylized "120 FPS" corner micro indicator -->
  <circle cx="48" cy="16" r="3" fill="#39F56A" />
</svg>
