<svg width="600" height="340" viewBox="0 0 600 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky_smooth" x1="0" y1="0" x2="0" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3A6B88"/>
      <stop offset="60%" stop-color="#73A3C0"/>
      <stop offset="100%" stop-color="#C5DCE8"/>
    </linearGradient>
    <linearGradient id="ground_smooth" x1="0" y1="180" x2="0" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#707A57"/>
      <stop offset="50%" stop-color="#556041"/>
      <stop offset="100%" stop-color="#3C452C"/>
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="600" height="210" fill="url(#sky_smooth)"/>
  <!-- Mountain silhouettes -->
  <path d="M0 190 L80 150 L180 175 L280 135 L380 165 L490 140 L600 180 L600 210 L0 210 Z" fill="#58737D" opacity="0.6"/>
  <path d="M0 205 L120 175 L220 195 L340 160 L460 190 L600 170 L600 210 L0 210 Z" fill="#4A616A" opacity="0.8"/>
  <!-- Ground -->
  <rect y="200" width="600" height="140" fill="url(#ground_smooth)"/>
  <!-- Erangel Houses in background -->
  <rect x="70" y="165" width="45" height="35" fill="#C2A882"/>
  <polygon points="65,165 92,145 120,165" fill="#8E4638"/>
  <rect x="85" y="175" width="10" height="15" fill="#3D4035"/>
  
  <rect x="130" y="170" width="55" height="30" fill="#B39B75"/>
  <polygon points="125,170 157,152 190,170" fill="#75382D"/>

  <rect x="420" y="162" width="60" height="38" fill="#C2A882"/>
  <polygon points="415,162 450,140 485,162" fill="#8E4638"/>
  
  <!-- Dirt path -->
  <path d="M220 200 L320 200 L440 340 L160 340 Z" fill="#7E6E56" opacity="0.6"/>

  <!-- Character 3rd Person View Back Silhouette -->
  <!-- Legs -->
  <path d="M280 270 L275 320 L287 322 L293 275 Z" fill="#2E332B"/>
  <path d="M305 270 L312 320 L300 322 L297 275 Z" fill="#292E26"/>
  <!-- Torso & Backpack -->
  <rect x="276" y="220" width="36" height="52" rx="4" fill="#3E453A"/>
  <rect x="279" y="224" width="30" height="34" rx="3" fill="#5C5542"/>
  <!-- Arms & Gun Sling -->
  <path d="M270 230 L260 270 L268 272 L277 240 Z" fill="#2E332B"/>
  <path d="M318 230 L328 270 L320 272 L312 240 Z" fill="#2E332B"/>
  <!-- Rifle mounted on back (M416) -->
  <rect x="306" y="195" width="6" height="65" rx="1" transform="rotate(22 306 195)" fill="#1F2326"/>
  <!-- Helmet Level 3 -->
  <ellipse cx="294" cy="208" rx="13" ry="14" fill="#2C3236"/>
  <rect x="286" y="206" width="16" height="4" rx="1" fill="#111315"/>

  <!-- HUD Overlay -->
  <!-- Mini Crosshair -->
  <circle cx="295" cy="175" r="2" fill="none" stroke="white" stroke-width="1.5" opacity="0.8"/>
  <line x1="290" y1="175" x2="284" y2="175" stroke="white" stroke-width="1.5" opacity="0.8"/>
  <line x1="300" y1="175" x2="306" y2="175" stroke="white" stroke-width="1.5" opacity="0.8"/>
  <line x1="295" y1="170" x2="295" y2="164" stroke="white" stroke-width="1.5" opacity="0.8"/>
  <line x1="295" y1="180" x2="295" y2="186" stroke="white" stroke-width="1.5" opacity="0.8"/>

  <!-- Smooth Mode Label badge -->
  <rect x="20" y="20" width="130" height="28" rx="6" fill="rgba(8,11,13,0.85)" stroke="#39F56A" stroke-width="1"/>
  <circle cx="34" cy="34" r="4" fill="#39F56A"/>
  <text x="46" y="38" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold">SMOOTH 60 FPS</text>
  
  <text x="20" y="320" fill="rgba(255,255,255,0.7)" font-family="monospace" font-size="11">Max Frame Rate • Low Latency</text>
</svg>
