<svg width="600" height="340" viewBox="0 0 600 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky_ultra" x1="0" y1="0" x2="0" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F2F4A"/>
      <stop offset="50%" stop-color="#3D6D8D"/>
      <stop offset="85%" stop-color="#FFA842"/>
      <stop offset="100%" stop-color="#FF5722"/>
    </linearGradient>
    <linearGradient id="ground_ultra" x1="0" y1="180" x2="0" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8C8242"/>
      <stop offset="35%" stop-color="#5E5828"/>
      <stop offset="100%" stop-color="#24210E"/>
    </linearGradient>
    <radialGradient id="sun_burst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#FFC107" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FF5722" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Ultra HD Cinematic Sky -->
  <rect width="600" height="210" fill="url(#sky_ultra)"/>
  <!-- Sun burst & volumetric rays -->
  <circle cx="460" cy="80" r="120" fill="url(#sun_burst)"/>
  <polygon points="460,80 300,340 380,340" fill="#FFE082" opacity="0.12"/>
  <polygon points="460,80 180,340 240,340" fill="#FFE082" opacity="0.08"/>

  <!-- Distant mountains with atmospheric haze -->
  <path d="M0 190 L80 145 L180 170 L280 130 L380 160 L490 135 L600 175 L600 210 L0 210 Z" fill="#2E3C45" opacity="0.9"/>
  <path d="M0 205 L120 170 L220 190 L340 155 L460 185 L600 165 L600 210 L0 210 Z" fill="#1C272E"/>

  <!-- High fidelity ground with water reflections or wet mud -->
  <rect y="200" width="600" height="140" fill="url(#ground_ultra)"/>
  <ellipse cx="280" cy="270" rx="90" ry="16" fill="#3D3A26" opacity="0.7"/>

  <!-- Buildings with warm sunset light and cast shadows -->
  <polygon points="65,200 130,200 170,230 40,230" fill="#000000" opacity="0.35"/>
  <rect x="70" y="165" width="45" height="35" fill="#DDBF96"/>
  <polygon points="65,165 92,145 120,165" fill="#B34F3D"/>
  <rect x="85" y="175" width="10" height="15" fill="#11120F"/>
  <rect x="130" y="170" width="55" height="30" fill="#CFB085"/>
  <polygon points="125,170 157,152 190,170" fill="#994636"/>
  <rect x="420" y="162" width="60" height="38" fill="#DDBF96"/>
  <polygon points="415,162 450,140 485,162" fill="#B34F3D"/>

  <!-- Detailed character with volumetric rim light -->
  <ellipse cx="294" cy="322" rx="30" ry="8" fill="#000" opacity="0.4"/>
  <path d="M280 270 L275 320 L287 322 L293 275 Z" fill="#232720"/>
  <path d="M305 270 L312 320 L300 322 L297 275 Z" fill="#1E221B"/>
  <rect x="276" y="220" width="36" height="52" rx="4" fill="#3F4638"/>
  <rect x="279" y="224" width="30" height="34" rx="3" fill="#6B6047"/>
  <path d="M308 222 L308 258" stroke="#FFD54F" stroke-width="2.5"/>
  <path d="M270 230 L260 270 L268 272 L277 240 Z" fill="#232720"/>
  <path d="M318 230 L328 270 L320 272 L312 240 Z" fill="#232720"/>
  <rect x="306" y="195" width="6" height="65" rx="1" transform="rotate(22 306 195)" fill="#0C0D0E"/>
  <ellipse cx="294" cy="208" rx="13" ry="14" fill="#2C3237"/>
  <path d="M304 200 C307 205, 307 212, 304 218" stroke="#FFE082" stroke-width="2" fill="none"/>

  <!-- Ultra HD Mode Label badge -->
  <rect x="20" y="20" width="135" height="28" rx="6" fill="rgba(8,11,13,0.85)" stroke="#FF9A24" stroke-width="1"/>
  <circle cx="34" cy="34" r="4" fill="#FF9A24"/>
  <text x="46" y="38" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold">ULTRA HD 45 FPS</text>
  
  <text x="20" y="320" fill="rgba(255,255,255,0.7)" font-family="monospace" font-size="11">4K Textures • Ray Shadows • Max Thermal</text>
</svg>
