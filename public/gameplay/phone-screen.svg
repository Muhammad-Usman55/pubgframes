<svg width="800" height="420" viewBox="0 0 800 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky_game" x1="0" y1="0" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2D5C7B"/>
      <stop offset="65%" stop-color="#6EA3C3"/>
      <stop offset="100%" stop-color="#E1EFF7"/>
    </linearGradient>
    <linearGradient id="ground_game" x1="0" y1="210" x2="0" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6C774C"/>
      <stop offset="50%" stop-color="#4E5936"/>
      <stop offset="100%" stop-color="#2D351D"/>
    </linearGradient>
  </defs>

  <!-- Sky & Horizon -->
  <rect width="800" height="230" fill="url(#sky_game)"/>
  <!-- Mountain layer -->
  <path d="M0 210 L120 160 L240 185 L390 140 L520 175 L670 145 L800 190 L800 230 L0 230 Z" fill="#4B6572" opacity="0.8"/>
  <path d="M0 220 L160 185 L290 205 L450 170 L600 200 L800 180 L800 230 L0 230 Z" fill="#3B505A"/>

  <!-- Ground -->
  <rect y="220" width="800" height="200" fill="url(#ground_game)"/>

  <!-- Erangel Pochinki Style Houses -->
  <rect x="90" y="175" width="60" height="48" fill="#C5AA84"/>
  <polygon points="85,175 120,150 155,175" fill="#8D4233"/>
  <rect x="110" y="190" width="14" height="20" fill="#20221B"/>

  <rect x="170" y="180" width="70" height="42" fill="#B79E78"/>
  <polygon points="165,180 205,158 245,180" fill="#75352A"/>

  <rect x="560" y="170" width="80" height="52" fill="#C5AA84"/>
  <polygon points="555,170 600,140 645,170" fill="#8D4233"/>

  <!-- Dirt road & grass vegetation -->
  <path d="M300 220 L440 220 L600 420 L220 420 Z" fill="#75654C" opacity="0.6"/>

  <!-- PUBG Character 3rd Person View (Running) -->
  <ellipse cx="395" cy="405" rx="35" ry="10" fill="#000" opacity="0.4"/>
  <!-- Legs running posture -->
  <path d="M375 320 L360 395 L376 398 L390 330 Z" fill="#292D25"/>
  <path d="M410 320 L425 390 L410 393 L398 330 Z" fill="#242821"/>
  <!-- Torso & Military Vest -->
  <rect x="370" y="250" width="48" height="72" rx="6" fill="#3D4537"/>
  <!-- Level 3 Backpack -->
  <rect x="374" y="255" width="40" height="48" rx="4" fill="#5F5743"/>
  <rect x="380" y="265" width="28" height="28" rx="3" fill="#4B4434"/>
  <!-- Arms & Holstered Gun -->
  <path d="M360 265 L345 325 L356 328 L370 280 Z" fill="#292D25"/>
  <path d="M425 265 L440 325 L430 328 L418 280 Z" fill="#292D25"/>
  <!-- M416 / Kar98k rifle slung across back -->
  <rect x="412" y="220" width="8" height="90" rx="2" transform="rotate(25 412 220)" fill="#151719"/>
  <!-- Level 3 Helmet with metallic sheen -->
  <ellipse cx="394" cy="235" rx="18" ry="19" fill="#2D3338"/>
  <rect x="382" y="232" width="24" height="6" rx="2" fill="#0C0E10"/>
  <line x1="385" y1="235" x2="403" y2="235" stroke="#FFF" stroke-width="1.5" opacity="0.7"/>

  <!-- PUBG MOBILE IN-GAME HUD -->
  <!-- Top Center: Compass / Heading -->
  <rect x="250" y="15" width="300" height="26" rx="4" fill="rgba(0,0,0,0.4)"/>
  <line x1="260" y1="28" x2="540" y2="28" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  <text x="395" y="24" fill="#FFD400" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">185 S</text>
  <text x="330" y="24" fill="#FFF" font-family="sans-serif" font-size="9" text-anchor="middle">150</text>
  <text x="470" y="24" fill="#FFF" font-family="sans-serif" font-size="9" text-anchor="middle">210</text>

  <!-- Top Left: Alive / Kill Count -->
  <rect x="25" y="16" width="130" height="28" rx="4" fill="rgba(0,0,0,0.5)"/>
  <text x="35" y="34" fill="#FFD400" font-family="sans-serif" font-size="11" font-weight="bold">ALIVE 42</text>
  <text x="95" y="34" fill="#FFF" font-family="sans-serif" font-size="11" font-weight="bold">KILLS 6</text>

  <!-- Top Right: Mini Map -->
  <circle cx="730" cy="65" r="45" fill="#222C24" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <circle cx="730" cy="65" r="30" fill="none" stroke="#39F56A" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="730" cy="65" r="3" fill="#FFD400"/>
  <polygon points="730,60 726,67 734,67" fill="#FFD400"/>

  <!-- Left Bottom: Virtual Joystick -->
  <circle cx="95" cy="325" r="42" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
  <circle cx="95" cy="325" r="20" fill="rgba(255,255,255,0.2)"/>

  <!-- Right Bottom: Action Buttons (Fire, Jump, Crouch) -->
  <circle cx="700" cy="305" r="28" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  <!-- Bullet icon inside fire button -->
  <path d="M698 296 L702 296 L702 312 L698 312 Z" fill="#FFF"/>
  <circle cx="745" cy="360" r="22" fill="rgba(255,255,255,0.15)"/>
  <circle cx="650" cy="365" r="22" fill="rgba(255,255,255,0.15)"/>

  <!-- Bottom Center: Health Bar & Weapon Inventory -->
  <rect x="290" y="375" width="220" height="8" rx="4" fill="rgba(0,0,0,0.6)"/>
  <rect x="290" y="375" width="180" height="8" rx="4" fill="#39F56A"/>
  <rect x="330" y="340" width="140" height="30" rx="4" fill="rgba(0,0,0,0.5)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="340" y="360" fill="#FFF" font-family="sans-serif" font-size="12" font-weight="bold">M416</text>
  <text x="430" y="360" fill="#39F56A" font-family="sans-serif" font-size="12" font-weight="bold">40/180</text>

  <!-- LIVE FPS HUD OVERLAY (TOP LEFT CORNER LIKE DESIGN MOCKUP) -->
  <rect x="40" y="55" width="75" height="42" rx="8" fill="rgba(8,11,13,0.92)" stroke="#39F56A" stroke-width="1.5"/>
  <text x="77" y="70" fill="rgba(255,255,255,0.7)" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">FPS</text>
  <text x="77" y="91" fill="#39F56A" font-family="sans-serif" font-size="20" font-weight="900" text-anchor="middle">90</text>
</svg>
