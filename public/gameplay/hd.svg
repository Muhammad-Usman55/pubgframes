<svg width="600" height="340" viewBox="0 0 600 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky_hd" x1="0" y1="0" x2="0" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#194B6B"/>
      <stop offset="60%" stop-color="#558DAE"/>
      <stop offset="100%" stop-color="#F2C785"/>
    </linearGradient>
    <linearGradient id="ground_hd" x1="0" y1="180" x2="0" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#737947"/>
      <stop offset="40%" stop-color="#555C31"/>
      <stop offset="100%" stop-color="#2C3218"/>
    </linearGradient>
    <filter id="hd_glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Sky with golden hour lighting -->
  <rect width="600" height="210" fill="url(#sky_hd)"/>
  <!-- Sun with lens flare -->
  <circle cx="480" cy="70" r="45" fill="#FFE8A3" opacity="0.8"/>
  <circle cx="480" cy="70" r="70" fill="#FFAE42" opacity="0.25"/>

  <!-- Mountain silhouettes with depth -->
  <path d="M0 190 L80 145 L180 170 L280 130 L380 160 L490 135 L600 175 L600 210 L0 210 Z" fill="#3D505B" opacity="0.85"/>
  <path d="M0 205 L120 170 L220 190 L340 155 L460 185 L600 165 L600 210 L0 210 Z" fill="#2E3F47"/>
  
  <!-- Ground -->
  <rect y="200" width="600" height="140" fill="url(#ground_hd)"/>
  
  <!-- Grass texture strokes -->
  <g stroke="#8FA348" stroke-width="1.5" opacity="0.6">
    <line x1="80" y1="280" x2="84" y2="272"/>
    <line x1="83" y1="280" x2="89" y2="270"/>
    <line x1="210" y1="290" x2="215" y2="280"/>
    <line x1="214" y1="290" x2="218" y2="278"/>
    <line x1="380" y1="270" x2="384" y2="260"/>
    <line x1="500" y1="290" x2="505" y2="280"/>
  </g>

  <!-- Erangel Houses with HD details -->
  <rect x="70" y="165" width="45" height="35" fill="#CBB28D"/>
  <polygon points="65,165 92,145 120,165" fill="#994636"/>
  <rect x="85" y="175" width="10" height="15" fill="#1C1D18"/>
  <rect x="130" y="170" width="55" height="30" fill="#BD9F77"/>
  <polygon points="125,170 157,152 190,170" fill="#803D31"/>
  <rect x="420" y="162" width="60" height="38" fill="#CBB28D"/>
  <polygon points="415,162 450,140 485,162" fill="#994636"/>

  <!-- Character with specular highlights -->
  <path d="M280 270 L275 320 L287 322 L293 275 Z" fill="#282C26"/>
  <path d="M305 270 L312 320 L300 322 L297 275 Z" fill="#232720"/>
  <rect x="276" y="220" width="36" height="52" rx="4" fill="#4A5243"/>
  <rect x="279" y="224" width="30" height="34" rx="3" fill="#756A52"/>
  <!-- Highlight -->
  <path d="M308 225 L308 255" stroke="#9E9274" stroke-width="2"/>
  <path d="M270 230 L260 270 L268 272 L277 240 Z" fill="#2E332B"/>
  <path d="M318 230 L328 270 L320 272 L312 240 Z" fill="#2E332B"/>
  <rect x="306" y="195" width="6" height="65" rx="1" transform="rotate(22 306 195)" fill="#111314"/>
  <ellipse cx="294" cy="208" rx="13" ry="14" fill="#3A4147"/>
  <rect x="286" y="206" width="16" height="4" rx="1" fill="#0A0B0C"/>

  <!-- HD Mode Label badge -->
  <rect x="20" y="20" width="110" height="28" rx="6" fill="rgba(8,11,13,0.85)" stroke="#A855F7" stroke-width="1"/>
  <circle cx="34" cy="34" r="4" fill="#A855F7"/>
  <text x="46" y="38" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold">HD 90 FPS</text>
  
  <text x="20" y="320" fill="rgba(255,255,255,0.7)" font-family="monospace" font-size="11">HDR Rendering • High Res Textures</text>
</svg>
