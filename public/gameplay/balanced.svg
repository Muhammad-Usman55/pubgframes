<svg width="600" height="340" viewBox="0 0 600 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky_bal" x1="0" y1="0" x2="0" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2E6283"/>
      <stop offset="70%" stop-color="#6DA1C1"/>
      <stop offset="100%" stop-color="#DFEFF8"/>
    </linearGradient>
    <linearGradient id="ground_bal" x1="0" y1="180" x2="0" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6B7850"/>
      <stop offset="60%" stop-color="#4C5737"/>
      <stop offset="100%" stop-color="#323B22"/>
    </linearGradient>
    <filter id="soft_shadow">
      <feDropShadow dx="3" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Sky -->
  <rect width="600" height="210" fill="url(#sky_bal)"/>
  <!-- Sun glare -->
  <circle cx="500" cy="50" r="30" fill="#FFFBE6" opacity="0.6"/>
  <!-- Mountain silhouettes -->
  <path d="M0 190 L80 150 L180 175 L280 135 L380 165 L490 140 L600 180 L600 210 L0 210 Z" fill="#4B6673" opacity="0.7"/>
  <path d="M0 205 L120 175 L220 195 L340 160 L460 190 L600 170 L600 210 L0 210 Z" fill="#3D535D" opacity="0.9"/>
  <!-- Ground -->
  <rect y="200" width="600" height="140" fill="url(#ground_bal)"/>
  
  <!-- Trees with ambient lighting -->
  <ellipse cx="40" cy="185" rx="16" ry="24" fill="#293D22"/>
  <rect x="38" y="195" width="4" height="14" fill="#1C1813"/>
  <ellipse cx="560" cy="180" rx="20" ry="30" fill="#2D4325"/>
  <rect x="558" y="195" width="4" height="18" fill="#1C1813"/>

  <!-- Erangel Houses in background -->
  <g filter="url(#soft_shadow)">
    <rect x="70" y="165" width="45" height="35" fill="#BFA37C"/>
    <polygon points="65,165 92,145 120,165" fill="#883E30"/>
    <rect x="85" y="175" width="10" height="15" fill="#292A24"/>
    <rect x="130" y="170" width="55" height="30" fill="#B39B75"/>
    <polygon points="125,170 157,152 190,170" fill="#75382D"/>
    <rect x="420" y="162" width="60" height="38" fill="#C2A882"/>
    <polygon points="415,162 450,140 485,162" fill="#8E4638"/>
  </g>
  
  <!-- Dirt path with texture -->
  <path d="M220 200 L320 200 L440 340 L160 340 Z" fill="#78664E" opacity="0.7"/>

  <!-- Character -->
  <g filter="url(#soft_shadow)">
    <path d="M280 270 L275 320 L287 322 L293 275 Z" fill="#2E332B"/>
    <path d="M305 270 L312 320 L300 322 L297 275 Z" fill="#292E26"/>
    <rect x="276" y="220" width="36" height="52" rx="4" fill="#444C3F"/>
    <rect x="279" y="224" width="30" height="34" rx="3" fill="#665E49"/>
    <path d="M270 230 L260 270 L268 272 L277 240 Z" fill="#2E332B"/>
    <path d="M318 230 L328 270 L320 272 L312 240 Z" fill="#2E332B"/>
    <rect x="306" y="195" width="6" height="65" rx="1" transform="rotate(22 306 195)" fill="#191C1E"/>
    <ellipse cx="294" cy="208" rx="13" ry="14" fill="#32383D"/>
    <rect x="286" y="206" width="16" height="4" rx="1" fill="#111315"/>
  </g>

  <!-- HUD Overlay -->
  <circle cx="295" cy="175" r="2" fill="none" stroke="white" stroke-width="1.5" opacity="0.9"/>
  <line x1="290" y1="175" x2="284" y2="175" stroke="white" stroke-width="1.5" opacity="0.9"/>
  <line x1="300" y1="175" x2="306" y2="175" stroke="white" stroke-width="1.5" opacity="0.9"/>

  <!-- Balanced Mode Label badge -->
  <rect x="20" y="20" width="145" height="28" rx="6" fill="rgba(8,11,13,0.85)" stroke="#28A9FF" stroke-width="1"/>
  <circle cx="34" cy="34" r="4" fill="#28A9FF"/>
  <text x="46" y="38" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold">BALANCED 75 FPS</text>
  
  <text x="20" y="320" fill="rgba(255,255,255,0.7)" font-family="monospace" font-size="11">Enhanced Shadows • Anti-Aliasing</text>
</svg>
