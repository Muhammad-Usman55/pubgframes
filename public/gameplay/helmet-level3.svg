<svg width="240" height="240" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="helm_gold" x1="40" y1="30" x2="200" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="50%" stop-color="#FFD400"/>
      <stop offset="100%" stop-color="#B28900"/>
    </linearGradient>
    <filter id="helm_glow">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#FFD400" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Spetsnaz Level 3 Helmet outline in gold -->
  <g filter="url(#helm_gold)">
    <!-- Helmet dome -->
    <path d="M60 120 C55 60, 185 60, 180 120 C180 135, 175 160, 168 185 L72 185 C65 160, 60 135, 60 120 Z" fill="#14181B" stroke="url(#helm_gold)" stroke-width="6"/>
    <!-- Visor frame -->
    <path d="M72 112 H168 V148 H72 Z" fill="#080B0D" stroke="url(#helm_gold)" stroke-width="4"/>
    <!-- Visor narrow slit with glass sheen -->
    <rect x="80" y="124" width="80" height="12" rx="2" fill="#FFD400" fill-opacity="0.2" stroke="#FFD400" stroke-width="2"/>
    <line x1="88" y1="128" x2="152" y2="128" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <!-- Rivets and tactical bolts -->
    <circle cx="68" cy="115" r="4" fill="#FFD400"/>
    <circle cx="172" cy="115" r="4" fill="#FFD400"/>
    <!-- Chin guard details -->
    <path d="M90 160 H150" stroke="#FFD400" stroke-width="3" stroke-linecap="round"/>
    <path d="M96 172 H144" stroke="#FFD400" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
