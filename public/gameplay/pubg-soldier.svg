<svg width="400" height="500" viewBox="0 0 400 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="soldier_glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFD400" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#FFD400" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFD400" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tie_grad" x1="0" y1="0" x2="0" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1E1E"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="shirt_grad" x1="120" y1="180" x2="280" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F5F5F7"/>
      <stop offset="60%" stop-color="#DCDFE3"/>
      <stop offset="100%" stop-color="#A5ACB5"/>
    </linearGradient>
  </defs>

  <!-- Golden background glow aura -->
  <circle cx="200" cy="190" r="190" fill="url(#soldier_glow)"/>

  <!-- Character Silhouette / Illustration: Iconic White Shirt + Black Tie + Level 3 Helmet + Shoulder Rifle -->
  <!-- Parachute in background -->
  <g opacity="0.35">
    <path d="M60 70 C70 40, 110 40, 120 70 Z" fill="#FFD400"/>
    <line x1="60" y1="70" x2="90" y2="110" stroke="#FFD400" stroke-width="1"/>
    <line x1="120" y1="70" x2="90" y2="110" stroke="#FFD400" stroke-width="1"/>
    <circle cx="90" cy="115" r="3" fill="#FFF"/>

    <!-- Fighter Jet passing -->
    <path d="M30 110 L55 105 L60 98 L64 105 L80 102 L65 109 L60 118 L55 110 Z" fill="#39F56A" opacity="0.4"/>
  </g>

  <!-- Rifle barrel slung behind right shoulder -->
  <rect x="260" y="30" width="12" height="180" rx="3" transform="rotate(18 260 30)" fill="#181B1E"/>
  <rect x="256" y="20" width="6" height="40" rx="1" transform="rotate(18 256 20)" fill="#2D3238"/>
  <rect x="252" y="8" width="14" height="14" rx="2" transform="rotate(18 252 8)" fill="#0C0D0E"/>

  <!-- White Button-up Shirt Body -->
  <path d="M110 240 L160 210 L240 210 L290 240 L310 420 L90 420 Z" fill="url(#shirt_grad)"/>
  
  <!-- Tactical Harness / Straps -->
  <path d="M135 220 L160 420 L175 420 L150 220 Z" fill="#252A2E"/>
  <path d="M265 220 L240 420 L225 420 L250 220 Z" fill="#252A2E"/>
  <rect x="150" y="310" width="100" height="14" rx="3" fill="#1B1E21"/>

  <!-- Iconic Black Tie -->
  <polygon points="190,225 210,225 214,350 200,370 186,350" fill="url(#tie_grad)"/>
  <polygon points="194,215 206,215 208,225 192,225" fill="#2D3035"/>

  <!-- Level 3 Helmet (Iconic PUBG Spetsnaz) -->
  <!-- Neck shadow -->
  <rect x="175" y="180" width="50" height="35" rx="10" fill="#0E1012"/>
  <!-- Helmet Dome -->
  <ellipse cx="200" cy="120" rx="65" ry="68" fill="#282E33"/>
  <path d="M135 125 C135 60, 265 60, 265 125 C265 160, 255 195, 240 205 L160 205 C145 195, 135 160, 135 125 Z" fill="#22272C"/>
  <!-- Visor Metallic Shield -->
  <path d="M142 110 H258 V165 H142 Z" fill="#14171A" stroke="#373E45" stroke-width="3"/>
  <!-- Visor Eye Slit Glass -->
  <rect x="154" y="128" width="92" height="15" rx="3" fill="#07090A" stroke="#FFD400" stroke-width="2"/>
  <line x1="165" y1="135" x2="235" y2="135" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <!-- Side Pivot Screws -->
  <circle cx="148" cy="118" r="5" fill="#FFD400"/>
  <circle cx="252" cy="118" r="5" fill="#FFD400"/>

  <!-- Golden/Yellow Lighting Flare on edges -->
  <path d="M260 90 C265 120, 263 150, 254 180" stroke="#FFD400" stroke-width="3" fill="none" opacity="0.8"/>
  <circle cx="260" cy="95" r="10" fill="#FFD400" opacity="0.3"/>
</svg>
